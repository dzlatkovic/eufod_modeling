[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eufod-modeling"
version = "0.2.0"
description = "Computational modeling of Eu(fod)3 using experimental chemical shift data."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "py3Dmol>=2.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
