<svg width="520" height="320" viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">EuFOD lanthanide shift geometry</title>
  <desc id="description">The distances from europium to oxygen and hydrogen, and the angle theta at europium.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c31"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="518" height="318" rx="16" fill="url(#background)" stroke="#334155" stroke-width="2"/>
  <!-- Geometric relationships -->
  <line x1="105" y1="177" x2="334" y2="94" stroke="#60a5fa" stroke-width="3"/>
  <line x1="105" y1="177" x2="407" y2="246" stroke="#fbbf24" stroke-width="3"/>
  <line x1="334" y1="94" x2="407" y2="246" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- Angle at Eu -->
  <path d="M 161 157 A 60 60 0 0 1 164 191" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text x="177" y="181" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">θᵢ</text>

  <!-- Distance labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="199" y="112" width="53" height="25" rx="12" fill="#172554"/>
    <text x="211" y="130" fill="#93c5fd">EuO</text>
    <rect x="225" y="220" width="92" height="25" rx="12" fill="#3a2d0a"/>
    <text x="237" y="238" fill="#fde68a">EuHᵢ (rᵢ)</text>
  </g>

  <!-- Atoms -->
  <circle cx="105" cy="177" r="19" fill="#8b5cf6" opacity="0.28" filter="url(#glow)"/>
  <circle cx="105" cy="177" r="12" fill="#a78bfa" stroke="#ddd6fe" stroke-width="2"/>
  <circle cx="334" cy="94" r="11" fill="#fb7185" stroke="#fecdd3" stroke-width="2"/>
  <circle cx="407" cy="246" r="9" fill="#34d399" stroke="#bbf7d0" stroke-width="2"/>

  <!-- Atom labels -->
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="57" y="213" font-size="16" fill="#ddd6fe">Eu³⁺</text>
    <text x="354" y="100" font-size="16" fill="#fecdd3">O</text>
    <text x="426" y="252" font-size="16" fill="#bbf7d0">Hᵢ</text>
  </g>
</svg>
