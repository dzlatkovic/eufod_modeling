<svg width="420" height="270" viewBox="0 0 420 270" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background Card for Dark/Light Mode Compatibility -->
  <rect width="100%" height="100%" fill="#ffffff" rx="10" ry="10"/>

  <!-- Connection Lines -->
  <line x1="70" y1="135" x2="270" y2="45" stroke="#1d4ed8" stroke-width="2.5" />
  <line x1="70" y1="135" x2="330" y2="215" stroke="#ea580c" stroke-width="2.5" />
  <line x1="270" y1="45" x2="330" y2="215" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Angle Arc -->
  <path d="M 120 112.5 A 50 50 0 0 1 123 151" fill="none" stroke="#1f2937" stroke-width="1.5" />
  <text x="135" y="137" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">θᵢ</text>

  <!-- Atoms -->
  <circle cx="70" cy="135" r="10" fill="#6d28d9" />
  <circle cx="270" cy="45" r="9" fill="#be185d" />
  <circle cx="330" cy="215" r="8" fill="#047857" />

  <!-- Atom Labels -->
  <text x="20" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">Eu³⁺</text>
  <text x="285" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#be185d">O</text>
  <text x="345" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#047857">Hᵢ</text>

  <!-- Distance / Segment Labels -->
  <text x="145" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">EuO</text>
  <text x="185" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ea580c">EuHᵢ (rᵢ)</text>
</svg>
